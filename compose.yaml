services:
  app:
    depends_on:
      database:
        condition: service_healthy
    image: ghcr.io/oskarbarcz/flight-tracker-api
    build:
      context: .
      target: development
    env_file:
      - .env
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
    ports:
      - '80:3000'
    healthcheck:
      test: 'curl --fail http://localhost:3000/api || exit 1'
      interval: 500ms
      retries: 3600
      start_period: 3s
      timeout: 500ms

  database:
    image: postgres:16.2@sha256:4aea012537edfad80f98d870a36e6b90b4c09b27be7f4b4759d72db863baeebb
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'pass'
      POSTGRES_DB: 'app'
    ports:
      - '5432:5432'
    healthcheck:
      test: 'pg_isready -U user -d app'
      interval: 1s
      timeout: 500ms
      retries: 30

  mock:
    image: mockoon/cli:9.9.0@sha256:c3b41126b87b22657a675574be9167a3d8d9f7f2cb21ec974c89c3631de56167
    command:
      - '--disable-admin-api'
      - '--data'
      - '/data/adsb.json'
      - '/data/skylink.json'
      - '/data/simbrief.json'
      - '/data/weather.json'
      - '/data/google.json'
      - '/data/sayintentions.json'
      - '/data/discord.json'
      - '/data/functions/aerolopa.json'
      - '/data/functions/osm.json'
      - '/data/functions/postcard.json'
      - '/data/functions/oceanic-tracks.json'
    volumes:
      - ./docker/mock:/data:ro
    ports:
      - '1080-1090:1080-1090'
    networks:
      default:
        aliases:
          - adsb-mock
          - skylink-mock
          - simbrief-mock
          - weather-mock
          - google-mock
          - sayintentions-mock
          - discord-mock
          - functions-mock
