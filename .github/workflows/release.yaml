name: 'release'

on:
  push:
    branches: ['main']

jobs:
  tag:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Release and push git tag'
        run: "git tag $(jq -r '.version' package.json) && git push --tags"
      - name: 'Create a GitHub release'
        run: "gh release create $(jq -r '.version' package.json) --generate-notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy:
    runs-on: 'ubuntu-latest'
    environment: image
    steps:
      - name: 'Login to ghcr.io'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: 'ghcr.io'
          username: '${{github.actor}}'
          password: '${{secrets.GITHUB_TOKEN}}'
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Build app docker image'
        run: |
          AUTHOR=$(jq -r ".author" package.json)
          NAME=$(jq -r ".name" package.json)
          VERSION=$(jq -r ".version" package.json)

          IMAGE="ghcr.io/${AUTHOR}/${NAME}"
          docker build --target production -t "${IMAGE}:${VERSION}" .

          # tag same image as :latest
          docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
      - name: 'Push docker image to ghcr.io'
        run: |
          AUTHOR=$(jq -r ".author" package.json)
          NAME=$(jq -r ".name" package.json)
          VERSION=$(jq -r ".version" package.json)

          IMAGE="ghcr.io/${AUTHOR}/${NAME}"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
  release:
    needs: deploy
    runs-on: ubuntu-latest
    environment: 'production'
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 'Pin deployed image to the released version'
        run: 'echo "IMAGE_TAG_FLIGHT_TRACKER_API=$(jq -r ''.version'' package.json)" >> "$GITHUB_ENV"'
      - name: 'Build and deploy on production'
        uses: 'digitalocean/app_action/deploy@cc55bc9b848d25f9c1c9f831cf843fbab3fbfb15' # v2.0.11
        with:
          app_name: 'mypreflight'
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          print_build_logs: true
          print_deploy_logs: true
