version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: daily

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
  - package-ecosystem: docker
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
  - package-ecosystem: docker-compose
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
